listen:
  udp: "0.0.0.0:53"
  tcp: "0.0.0.0:53"
  dot:
    addr: "0.0.0.0:853"
    cert: certs/server.crt
    key: certs/server.key
  doh:
    addr: "0.0.0.0:443"
    path: "/dns-query"
    cert: certs/server.crt
    key: certs/server.key

access:
  allow:                 # only these clients get answers (plan §5.5)
    - "127.0.0.0/8"
    - "::1/128"
    - "192.168.0.0/16"
    - "10.0.0.0/8"
  deny_action: refuse    # refuse (send REFUSED) | drop (send nothing)

resolver:
  mode: recursive        # recursive | forward
  root_hints: config/named.root
  qname_minimisation: true
  edns_buffer: 1232
  use_0x20: true
  max_upstream_queries: 30
  max_referral_depth: 16
  max_cname_chain: 8
  query_timeout_ms: 800
  overall_deadline_ms: 5000
  spoof_tcp_threshold: 5   # forged-looking replies to one query before retrying it over TCP; 0 = off
  # stub_zones:              # names under a zone start at its servers, not the root
  #   lab.: ["10.10.0.2"]    # e.g. the lab mini-internet (plan §2.5, §3.3)

cache:
  max_memory_mb: 256
  shards: 16
  min_ttl: 0
  max_ttl: 86400
  serve_stale:
    enabled: true
    stale_ttl: 30
    max_stale_age: 86400
    answer_after_ms: 1800  # still resolving after this? answer stale meanwhile (RFC 8767); 0: only on failure
  prefetch:
    enabled: true
    threshold_pct: 10    # trigger when <10% TTL remaining

policy:
  blocklists:              # plan §5.6; get the feeds with config/lists/download_feeds.sh
    - config/lists/feeds/ads.txt
    - config/lists/feeds/trackers.txt
    - config/lists/feeds/malware.txt
    - config/lists/custom_block.txt   # names confirmed on the dashboard, or added by hand
  allowlist: config/lists/allow.txt   # beats every blocklist
  block_response: null_ip  # null_ip (0.0.0.0 / ::) | nxdomain
  block_ttl: 60
  reload_check_seconds: 60 # reload the lists when a file changes; 0 = only on SIGHUP
  check_cname_chain: true
  rebinding_protection:    # plan §5.8: public names may not resolve to private addresses
    enabled: true
    exempt: [home.arpa, internal, localhost, local, lan, home]  # local names (and below); stub zones are added
  dynamic_rules:           # README §7.6.6: time-limited rules from the slow path (analyzer/live.py); never the lists
    enabled: true
    max_rules: 10000       # more are refused
    max_ttl: 86400         # seconds; a rule asked for longer gets this
    response: nxdomain     # what names under a rule get: nxdomain (malware verdicts) | null_ip

rate_limit:                # plan §5.9
  per_client:              # token bucket per client IP
    qps: 100               # sustained queries per second; 0 = no limit
    burst: 200             # what a quiet client may send at once
    action: drop           # drop | refuse
  rrl:                     # identical UDP responses per client network (anti-amplification)
    responses_per_second: 10   # 0 = off; raise it for many clients behind one /24
    slip: 2                # every 2nd response over the cap goes out truncated (retry over TCP)
    window_seconds: 1
    ipv4_prefix: 24        # a client network is a /24 ...
    ipv6_prefix: 56        # ... or a /56
  exempt: []               # subnets neither limit applies to, e.g. a router forwarding a whole LAN

ml:
  dga:                     # plan §7.8.2: is a name's registrable label machine-generated?
    enabled: true
    mode: monitor          # monitor: log what it flags | enforce: answer it like a blocked name
    model: models/dga      # the model ml/dga trained (ml/dga/README.md)
    words: config/english_words.txt
    allowlist: config/lists/feeds/tranco_top100k.txt  # popular sites, never scored (download_feeds.sh)
    threshold: 0           # 0: the model's own, flagging 0.1% of benign names in training
    cache_size: 100000     # verdicts kept, one per registrable domain

telemetry:
  events:                  # README §6.2: every answered query, one JSON line, to the slow path
    socket: /tmp/dnsentinel/events.sock  # a Unix socket, mode 0600 (its directory is made 0700 if missing)
    buffer_kb: 4096        # per reader: a reader this far behind loses events; answers never wait
    max_readers: 8
    commands: true         # readers may add and remove dynamic rules (policy.dynamic_rules)
  prometheus:               # GET http://127.0.0.1:9153/metrics; no authentication, so keep it local
    addr: "127.0.0.1:9153"
  query_log:                # every answered query as a JSON line, a file per UTC day
    enabled: true
    path: logs/queries.jsonl  # gives logs/queries-YYYY-MM-DD.jsonl (relative to where it runs)
    retention_days: 7       # older day files are removed; 0 keeps everything
    anonymise_clients: false  # true: a keyed hash ("anon-..."), the key kept beside the log
    ring_buffer_size: 8192  # lines waiting for the disk; past this they are dropped and counted
    exclude: []             # clients never logged, e.g. ["10.0.5.0/24"]
