server:
  interface: 0.0.0.0
  port: 53
  access-control: 172.16.0.0/12 allow
  access-control: 127.0.0.0/8 allow
  root-hints: /dnsentinel/config/named.root
  qname-minimisation: yes
  module-config: "iterator"
  username: ""
  chroot: ""
  directory: "/tmp"
  pidfile: ""
  use-syslog: no
  logfile: ""
  harden-glue: yes
