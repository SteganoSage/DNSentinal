# Unbound in the lab: the production resolver E1 and E2 compare against, with the same root.
server:
  interface: 0.0.0.0
  port: 53
  access-control: 10.53.1.0/24 allow
  access-control: 127.0.0.0/8 allow
  root-hints: /dnsentinel/lab/hierarchy/out/root.hints
  do-not-query-localhost: no
  qname-minimisation: yes
  module-config: "iterator"        # the lab is unsigned: no DNSSEC validation
  username: ""
  chroot: ""
  directory: "/tmp"
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
  num-threads: 2
remote-control:
  control-enable: no
